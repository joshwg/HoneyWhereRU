  <path d="M -900 1500 C -100 1050, 250 560, 520 500 S 1100 470, 1900 -200" stroke="#FFD677" stroke-width="60" fill="none"/>
</g>

<defs>
  <radialGradient id="dotfill" cx="0.4" cy="0.35" r="0.75">
