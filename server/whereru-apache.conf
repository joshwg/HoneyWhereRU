# Apache2 reverse-proxy vhost for the Whereru server.
#
# Copy to /etc/apache2/sites-available/whereru.conf on the EC2 instance,
# replace the ServerName with your real domain, then:
#   sudo a2enmod proxy proxy_http
#   sudo a2ensite whereru
#   sudo systemctl reload apache2
#
# After that, run certbot (see README) to add HTTPS -- it edits this file
# in place to add the :443 block and an http->https redirect, so there's
# nothing further to do here manually.

# Access-log format without the client IP (%h) or any identifying header.
# Each line is just: time, request, status, bytes, user-agent -- enough to
# see post frequency and errors, but not which phone, or where, a line came
# from. Defined outside the vhost so certbot's generated :443 block (which
# copies the CustomLog line) can use the same name.
LogFormat "[%{%Y-%m-%d %H:%M:%S}t] \"%r\" %>s %b \"%{User-Agent}i\"" whereru_noip

<VirtualHost *:80>
    ServerName whereru.yourdomain.com

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/whereru-error.log
    CustomLog ${APACHE_LOG_DIR}/whereru-access.log whereru_noip
</VirtualHost>
